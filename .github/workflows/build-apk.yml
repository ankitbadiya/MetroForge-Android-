name: MetroForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Project
        run: npx cap add android

      - name: Add Native Activity
        run: |
          mkdir -p android/app/src/main/java/com/metroforge/citybuilder
          cp MainActivity.java android/app/src/main/java/com/metroforge/citybuilder/MainActivity.java

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()

          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")

          app.set(ns + "label", "MetroForge 3D")
          app.set(ns + "usesCleartextTraffic", "true")

          for activity in app.findall("activity"):
              if activity.get(ns + "name", "").endswith("MainActivity"):
                  activity.set(ns + "screenOrientation", "sensorLandscape")

          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroForge-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
