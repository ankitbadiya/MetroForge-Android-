
name: MetroForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Add native activity
        run: |
          mkdir -p android/app/src/main/java/com/metroforge/citybuilder
          cp MainActivity.java android/app/src/main/java/com/metroforge/citybuilder/MainActivity.java

      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          app.set(ns+"label", "MetroForge 3D")
          app.set(ns+"usesCleartextTraffic", "true")
          for a in app.findall("activity"):
              if a.get(ns+"name", "").endswith("MainActivity"):
                  a.set(ns+"screenOrientation", "sensorLandscape")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroForge-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
